name: Build FrameForge installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust unit tests
        working-directory: app/src-tauri
        run: cargo test --release

      - name: Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Build offline AI engine (TabPFN, frozen) + offline smoke test
        run: |
          python -m pip install --upgrade pip
          pip install -r app/engine/requirements.txt huggingface_hub
          python app/engine/build_engine.py

      - name: Bundle PresentMon console build (MIT)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pick the console x64 asset of the latest release instead of hard-coding a file name.
          $rel = gh api repos/GameTechDev/PresentMon/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^PresentMon-[\d\.]+-x64\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "No console x64 PresentMon asset found in $($rel.tag_name)" }
          Write-Host "Using $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile app/src-tauri/resources/tools/PresentMon.exe
          Invoke-WebRequest "https://raw.githubusercontent.com/GameTechDev/PresentMon/$($rel.tag_name)/LICENSE.txt" -OutFile app/src-tauri/resources/tools/LICENSE-PresentMon.txt
          Get-FileHash app/src-tauri/resources/tools/PresentMon.exe -Algorithm SHA256
          & app/src-tauri/resources/tools/PresentMon.exe --help | Select-Object -First 5

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: App icons from brand mark (square crimson "FF")
        working-directory: app/src-tauri
        run: cargo tauri icon icons/source.svg

      - name: Build installer
        working-directory: app/src-tauri
        run: cargo tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: FrameForge-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
