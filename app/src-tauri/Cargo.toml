[package]
name = "frameforge"
version = "1.0.0"
description = "FrameForge — finds the best graphics settings for your PC, 100% offline"
authors = ["FrameForge"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[lib]
name = "frameforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Pinned: 0.30 API (System::new_all, refresh_processes(), Process::name() -> &str)
sysinfo = "=0.30.13"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
